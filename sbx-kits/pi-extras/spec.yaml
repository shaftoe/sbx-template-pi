# This is a **mixin** kit — it stacks on top of an agent kit (pi or pi-base)
# to add shared workspace files, skills, and a custom AGENTS.md supplement.
#
# Usage:
#   sbx run --kit ./sbx-kit/ --kit ./sbx-kits/pi-extras/ pi
#   sbx run --kit ./sbx-kits/pi-base/ --kit ./sbx-kits/pi-extras/ pi
#
# From GitHub:
#   sbx run \
#     --kit "git+https://github.com/shaftoe/sbx-template-pi.git#dir=sbx-kits/pi-base" \
#     --kit "git+https://github.com/shaftoe/sbx-template-pi.git#dir=sbx-kits/pi-extras" \
#     pi

schemaVersion: "1"
kind: mixin
name: pi-extras
displayName: Pi extras (mixin)
description: >
  Stacks on any Pi agent kit.  Adds shared skills, workspace configs,
  and git safety settings for the sandbox environment.

credentials:
  sources:
    deepseek:
      env:
        - DEEPSEEK_API_KEY
    freestyle:
      env:
        - FREESTYLE_API_KEY
    stepfun:
      env:
        - STEP_API_KEY
    tavily:
      env:
        - TAVILY_API_KEY
    zai:
      env:
        - ZAI_API_KEY

# ---------------------------------------------------------------------------
# Environment — proxy-managed secrets injected into the sandbox.
# ---------------------------------------------------------------------------
environment:
  proxyManaged:
    - DEEPSEEK_API_KEY
    - FREESTYLE_API_KEY
    - STEP_API_KEY
    - TAVILY_API_KEY
    - ZAI_API_KEY

# ---------------------------------------------------------------------------
# Network — additional domains this mixin needs
# ---------------------------------------------------------------------------
network:
  serviceDomains:
    api.tavily.com: tavily
    api.deepseek.com: deepseek
    api.freestyle.sh: freestyle
    api.stepfun.ai: stepfun
  serviceAuth:
    tavily:
      headerName: Authorization
      valueFormat: "Bearer %s"
    deepseek:
      headerName: Authorization
      valueFormat: "Bearer %s"
    freestyle:
      headerName: Authorization
      valueFormat: "Bearer %s"
    stepfun:
      headerName: Authorization
      valueFormat: "Bearer %s"
  allowedDomains:
    - api.z.ai:443
    - api.tavily.com:443
    - api.deepseek.com:443
    - api.freestyle.sh:443
    - api.stepfun.ai:443

# ---------------------------------------------------------------------------
# Commands — install pi-shared skills and extensions
# ---------------------------------------------------------------------------
commands:
  install:
    - command: "pi install git:github.com/shaftoe/pi-shared"
      user: "1000"
    - command: "pi install npm:@alexanderfortin/pi-zai-usage"
      user: "1000"
    - command: "pi install npm:@alexanderfortin/pi-freestyle-sandbox"
      user: "1000"
    - command: "pi install npm:@alexanderfortin/pi-tavily-tools"
      user: "1000"
    - command: "pi install npm:@alexanderfortin/pi-token-usage"
      user: "1000"
    - command: "pi install npm:@alexanderfortin/pi-deepseek-usage"
      user: "1000"
    - command: "pi install npm:@alexanderfortin/pi-stepfun-usage"
      user: "1000"
    - command: "pi install npm:@alexanderfortin/pi-loaded-tools"
      user: "1000"

  startup:
    - command: ["sh", "-c", 'git config --global user.email "agent@pi.dev" 2>/dev/null; git config --global user.name "Pi Agent" 2>/dev/null']
      user: "1000"
      description: "Set default git identity for the agent user"
